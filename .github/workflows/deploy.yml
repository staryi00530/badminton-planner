name: Deploy to GitHub Pages

on:
  push:
    branches: [main, beta]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: site-main

      - name: Checkout beta
        uses: actions/checkout@v4
        with:
          ref: beta
          path: site-beta

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test & build main
        working-directory: site-main
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm run build

      - name: Test & build beta
        working-directory: site-beta
        env:
          VITE_BETA: 'true'
        run: |
          npm ci
          npm test
          npx vite build --base=/badminton-planner/beta/ --outDir=dist-beta

      - name: Combine into one Pages artifact
        run: |
          mkdir -p combined
          cp -r site-main/dist/. combined/
          mkdir -p combined/beta
          cp -r site-beta/dist-beta/. combined/beta/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
